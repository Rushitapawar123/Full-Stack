<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <fieldset>
      <table border="2" cellspacing="0">
        <form action="">
          <tr>
            <th colspan="4" rowspan="1">Registration Form</th>
            <!-- <td></td> -->
          </tr>
          <br />
          <br />
          <tr>
            <td>Student name</td>
            <td>
              <input
                type="text"
                name="name"
                id="name"
                placeholder="First Name"
              />
            </td>
            <td>
              <input
                type="text"
                name="name"
                id="name"
                placeholder="Middle Name"
              />
            </td>
            <td>
              <input
                type="text"
                name="name"
                id="name"
                placeholder="Last Name"
              />
            </td>
          </tr>

          <tr>
            <th>Father's Name</th>
            <td>
              <input
                type="text"
                name="fname"
                id="fname"
                placeholder="Enter your Father's Name"
              />
            </td>
            <th>Mother's Name</th>
            <td>
              <input
                type="text"
                name="Mname"
                id="Mname"
                placeholder="Enter your Mother's Name"
              />
            </td>
          </tr>

          <tr>
            <th>Date of Birth</th>
            <td><input type="date" name="date" id="date" /></td>
            <th>Gender</th>
            <th>
              <input type="radio" name="Gender" id="Gender" value="male" />
              <span>Male</span>
              <input type="radio" name="Gender" id="Gender" value="Female" />
              <span>Female</span>
            </th>
          </tr>

          <tr>
            <th>Category</th>
            <th>
              <input type="radio" name="category" id="Gen" value="GEn" /><span
                >Gen</span
              >
              <input type="radio" name="category" id="OBC" value="OBC" /><span
                >OBC</span
              >
              <input
                type="radio"
                name="category"
                id="SC/st"
                value="Sc/ST"
              /><span>SC/ST</span>
            </th>

            <th>Hadicapped</th>
            <th>
              <input type="radio" name="category" id="Yes" value="Yes" /><span
                >Yes</span
              >
              <input type="radio" name="category" id="No" value="NO" /><span
                >No</span
              >
            </th>
          </tr>

          <tr>
            <th>EX-Serviceman</th>
            <th>
              <input
                type="radio"
                name="EX-Serviceman"
                id="EX-Serviceman"
                value="Yes"
              /><span>Yes</span>
              <input
                type="radio"
                name="EX-Serviceman"
                id="EX-Serviceman"
                value="No"
              /><span>No</span>
            </th>

            <th>EWS</th>
            <th>
              <input type="radio" name="EWS" id="EWS" value="YEs" /><span
                >Yes</span
              >
              <input type="radio" name="EWS" id="EWS" value="Yes" /><span
                >No</span
              >
            </th>
          </tr>

          <tr>
            <th>Email ID</th>
            <td><input type="email" name="Email" id="Email" /></td>
            <th>Mobile No.</th>
            <td>
              <input type="number" name="MobileNumber" id="MobileNumber" />
            </td>
          </tr>

          <tr>
            <th>State</th>
            <th>
              <select name="state" id="state">
                <option value="select">Select only one</option>
              </select>
            </th>
            <th>City</th>
            <th>
              select
              <select name="selectity" id="selectity">
                <option value="selectity">Select only one</option>
              </select>
            </th>
          </tr>
          <tr>
            <th>Upload Photo</th>
            <th>
              <input type="file" name="File" id="File" />
            </th>
            <th>Upload Signature</th>
            <th><input type="File" name="File" id="File" /></th>
          </tr>

          <tr>
            <td></td>
            <td colspan="3"><button>Submit</button></td>
          </tr>
        </form>
      </table>
    </fieldset>
  </body>
</html>
