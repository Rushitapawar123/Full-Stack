  <body>
    <form action="">
      <img src="./OIP.jpg" alt="" width="200px" height="490px" align="left"/>

      <input type="text" name="name" id="name" placeholder="last" />

      <label for="phone">phone</label>

      <input type="text" name="address" id="address" placeholder="State" />

      <input type="address" name="YourQuery" id="YOURQuery" />
      <br />
      <br />
      <label for="AppointmentType"> Appointment Type</label>
