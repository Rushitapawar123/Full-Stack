<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <fieldset>
      <form action="">
        <h2>Pizza Order Form</h2>
        <label for="FullName">Full Name :</label>
        <input type="Fullname" name="FullName" id="FullName" />
        <br />
        <br />
        <label for="LastName"> Last Name :</label>
        <input type="LastName" name="LastName" id="LastName" />
        <br />
        <br />
        <label for="Email">Email Address :</label>
        <input type="Email" name="Email" id="Email" />
        <br />
        <br />
        <label for="contectNumber">Contact Number :</label>
        <input type="Number" name="Contact Number" id="Contact number" />
        <br />
        <br />
        <label for="PreferredDliveryDate">Preferred Delivery Date</label>
        <input
          type="date"
          name="PreferredDliveryDate"
          id="PreferredDeliveryDate"
        />
        <br />
        <br />
        <label for="size">Size :</label>
        <br />
        <input type="radio" name="size" id="small" value="Small" />
        <span>Small</span>

        <input type="radio" name="size" id="Medium" value="Medium" />
        <span>Medium</span>

        <input type="radio" name="size" id="Large" value="Large" />
        <span>Large</span>
        <br />
        <br />
        <label for="Flavor">Flavor :</label>
        <br />
        <input type="checkbox" name="Flavor" id="hawallan" value="hawalan" />
        <span>Hawaiian(Php 150 00) </span>
        <select name="1" id="1">
          <option value="1">1</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5">5</option>
        </select>
        <br />
        <br />
        <input type="checkbox" name="Flavor" id="Peppeeoni" value="Peppeeoni" />
        <span>Pepperoni(Php 140 00)</span>
        <select name="1" id="1">
          <option value="1">1</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5">5</option>
        </select>
        <br />
        <br />

        <input type="checkbox" name="Flavor" id="Vegetable" value="Vegetable" />
        <span>Vegetable(Php 1300)</span>
        <select name="1" id="1">
          <option value="1">1</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5">5</option>
        </select>
        <br />
        <br />

        <label for="CreditCardNumber"> Credit Card Number :</label>
        <input type="Number" name="CreditCardNumber" id="CreditCardNumber" />

        <br /><br />
        <label for="PIN">PIN</label>
        <input type="NUmber" name="PIN" id="PIN" />
        <br />
        <br />
        <label for="Additional Note"> Additional Note</label>
        <br />
        <textarea type="Address" name="AdditionalNote" id="AdditionalNote">
        </textarea>
        <br />
        <button>Submit Order</button>
      </form>
    </fieldset>

    <br />

  </body>
</html>
