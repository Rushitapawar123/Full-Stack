<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header><i class="bi bi-file-lock"></i>
      <div class="container bg-primary text-center">
        <div class="">
          <h1 class="text-light card-header fw-bold">My Todo List</h1>
          <div class="text-light">
            <p>organize your day,one task at a time</p>
          </div>
        </div>
      </div>
    </header>

    <main class="container">
      <section class="p-3 border rounded shadow mt-3 d-flex gap-3">
        <input
          type="text"
          name="name"
          id="taskInput"
          placeholder="Add your task"
          class="form-control"
        />
        <button class="btn btn-primary text-nowrap" onclick="addTask()">
          Add your task
        </button>
      </section>
      <section class="d-flex gap3 text-center my-3">
        <div class="flex-fill p-3 bg-primary-subtle rounded">
          <h2 id="totalcount">0</h2>
          <p class="mb-0">Total</p>
        </div>
        <div class="flex-fill p-3 bg-primary-subtle rounded">
          <h2 id="donecount">0</h2>
          <p class="mb-0">pending</p>
        </div>
        <div class="flex-fill p-3 bg-primary-subtle rounded">
          <h2 id="pendingCount">0</h2>
          <p class="mb-0">completed</p>
        </div>
      </section>
      <div class="btn-group mb-3 gap-5 d-flex">
        <button class="btn btn-outline-primary" onclick="setFilter('all')">
          All
        </button>
        <button class="btn btn-outline-primary" onclick="setFilter('pending')">
          pending
        </button>
        <button class="btn btn-outline-primary" onclick="setFilter('done')">
          Done
        </button>
      </div>
      <!-- <div class="container">
        <div class="form-control">
          <input type="checkbox" name="" id="" />
        </div>
      </div> -->

      <section class="container p3 border rounded shadow mt-3 d-flex gap-4">
        <ol class="w-100" id="taskList">
          <!-- <li  class="p-3">
                    <input type="checkbox" name="" id="">
                    <span>task1</span>
                    <button class="btn btn-danger btn-sm ms-3">Delete</button>
                </li> -->
        </ol>
      </section>
    </main>

    <!-- script -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="script.js"></script>
  </body>
</html>
