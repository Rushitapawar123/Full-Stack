    <header class="">
      <nav class="navbar px-5 bg-primary">
        <div class="navbar-brand text-light fs-3">password manager</div>
      </nav>
    </header>

    <section class="container p-3 rounded shadow border">
      <div class="d-flex gap-3 w-100">
        <div class="w-100">
          <label for="websitename">websitename</label>
          <input
            type="text"
            name="websitename"
            id="websitename"
            class="form-control"
          />
        </div>

        <div class="w-100">
          <label for="usernmae">username</label>
          <input
            type="text"
            name="username"
            id="username"
            class="form-control"
          />
        </div>
      </div>
      <div class="d-flex gap-3 w-100">
        <div class="w-100">
          <label for="password">password</label>
          <input
            type="password"
            name="password"
            id="password"
            class="form-control"
          />
        </div>
        <div class="w-100">
          <label for="cfpassword">confirm password</label>
          <input
            type="password"
            name="cfpassword"
            id="cfpassword"
            class="form-control"
          />
        </div>
      </div>
      <div class="mt-2 d-flex justify-content-between">
        <button class="btn btn-secondary" onclick="clearform()">Clear form</button>
         <button class="btn btn-primary" onclick="SavePassword()">
          SavePassword
        </button>
      </div>
    </section>

        <thead class="table-primary text-center">
