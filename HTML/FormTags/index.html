<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>basic form</title>
  </head>
  <body>
    <fieldset>
      <legend align="center">Basic form</legend>
      <form>
        <label for="fullName"> Full name :</label>
        <input
          type="text"
          name="Rushita"
          id="fullName"
          placeholder="Enter your name"
        />

        <br />
        <br />

        <label for="Email"> Email :</label>
        <input
          type="email"
          name="email"
          id="Email"
          placeholder="enter your email"
        />

        <br />
        <br />
        <label for="Password"> Password :</label>
        <input
          type="password"
          name="Password"
          id="password"
          placeholder="password"
        />

        <br />
        <br />
        <label for="cfpassword"> Confirm Password :</label>
        <input
          type="Password"
          name="cfpassword"
          id="cfpassword"
          placeholder="ConfirmPassword"
        />

        <br />
        <br />

        <label for="dob"> date of birth :</label>
        <input type="date" name="dateofbirth" id="dob" />
        <br />
        <br />

        <label for="Tob"> Time :</label>
        <input type="Time" name="tob" id="Tob" />

        <br />
        <br />
        <label for="joiningTime"> Joinning Time :</label>
        <input type="datetime-local" name="joiningTime" id="joiningTime" />

        <br />
        <br />
        <label for="Volume"> Volume:</label>
        <input
          type="Range"
          name="Volume"
          id="Volume"
          min="0"
          max="10"
          value="3"
        />
        <br />
        <br />

        <label for="MobileNumber"> Mobile Number:</label>
        <input type="Number" name="MobileNumber" id="MobileNumber" />

        <br />
        <br />

        <label for="File"> File:</label>
        <input type="File" name="File" id="File" />
        <br />
        <br />
        <label for="address"> address:</label>
        <textarea name="address" id="address"></textarea>
        <br />
        <br />
        <label for="Course"> Course</label>
        <select name="Course" id="Course">
          <option value="--Select Course--">select course</option>
          <option value="btach">B tach</option>
          <option value="bba">BBa</option>
          <option value="Match">Mtach</option>
          <option value="MBA">MBA</option>
          <option value="BsC">BsC</option>
        </select>
        <br />
        <br />

        <label for="Gender">Gender</label>
        <input type="radio" name="gender" id="Gender" value="male" />
        <span>Male</span>

        <input type="radio" name="gender" id="Gender" value="female" />
        <span>Female</span>

        <input type="radio" name="gender" id="Gender" value="Other" />
        <span>Other</span>
        <br />
        br
        <label for="SkillSet">SkillSet</label>
        <input type="checkbox" name="Java" id="Java" value="Java" />
        <span>Java</span>

        <input type="checkbox" name="DSA" id="DSA" value="DSA" />
        <span>DSA</span>

        <input type="checkbox" name="HTML" id="HTML" value="HTML" />
        <span>HTML</span>

        <img src="./ganish ji.jpeg" alt="" 
        width="100px" hight="100px"/>
        
<br>
        <button>submit</button>
      </form>
    </fieldset>
  </body>
</html>
